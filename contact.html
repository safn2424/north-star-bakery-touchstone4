<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery - Contact</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Contact North Star Bakery</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Location and Hours</h2>

            <p>Location: [Bakery location]</p>
            <p>Hours: [Bakery hours]</p>
        </section>

        <section>
            <h2>Inquiry and Pre-Order Request</h2>

            <form id="contact-form" action="#" method="post">

                <fieldset>
                    <legend>Contact Information</legend>

                    <p>
                        <label for="name">Name:</label><br>
                        <input type="text" id="name" name="name" required>
                        <span id="name-error" class="error-message"></span>
                    </p>

                    <p>
                        <label for="email">Email:</label><br>
                        <input type="email" id="email" name="email" required>
                        <span id="email-error" class="error-message"></span>
                    </p>

                    <p>
                        <label for="pickup-date">Pickup Date:</label><br>
                        <input type="date" id="pickup-date" name="pickup-date" required>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Request Details</legend>

                    <p>
                        <label for="request-type">Request Type:</label><br>
                        <select id="request-type" name="request-type" required>
                            <option value="">Choose a request type</option>
                            <option value="pre-order">Pre-Order</option>
                            <option value="general-question">General Question</option>
                        </select>
                    </p>

                    <p>
                        <label for="item-details">Item Details:</label><br>
                        <textarea id="item-details"
                                  name="item-details"
                                  rows="4"
                                  cols="40"
                                  required></textarea>
                        <span id="details-error" class="error-message"></span>
                    </p>

                    <p>
                        <label for="allergy-notes">Allergy Notes:</label><br>
                        <textarea id="allergy-notes"
                                  name="allergy-notes"
                                  rows="3"
                                  cols="40"></textarea>
                    </p>
                </fieldset>

                <p>
                    <button type="submit">Submit Request</button>
                </p>

            </form>
        </section>

    </main>

    <footer>
        <p>North Star Bakery</p>
    </footer>

</body>

</html>
